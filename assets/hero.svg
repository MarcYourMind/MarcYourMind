<g fill="#DCEAF4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">
  <text x="798" y="118">AI / ML</text>
  <text x="1087" y="117">QUANT</text>
  <text x="1126" y="251">BACKEND</text>
  <text x="1090" y="389">WEB3</text>
